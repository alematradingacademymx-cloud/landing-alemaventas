# ALEMA Noticias: cada 30 minutos genera las páginas para compartir (/noticias/n/...) y actualiza sitemap.xml.
# También se puede correr a mano: pestaña Actions → "ALEMA Noticias" → Run workflow.
name: ALEMA Noticias
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  paginas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generar páginas de noticias
        run: node tools/noticias-build.mjs
      - name: Guardar cambios
        run: |
          git config user.name "ALEMA Noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias/n sitemap.xml
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Noticias: actualizar páginas para compartir" && git push; fi
