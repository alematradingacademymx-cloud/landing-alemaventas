<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEMA Trading Academy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0E1726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ALEMA Portal">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0E1726; }
    /* El iframe mide 50px más que la pantalla para tapar la franja inferior de Streamlit */
    iframe { border: none; width: 100%; height: calc(100vh + 50px); display: block; }
  </style>
</head>
<body>
  <iframe id="app" title="ALEMA Portal" allow="clipboard-write; fullscreen"></iframe>
  <script>
    // PRUEBA: carga la app de prueba. En la versión final solo cambia esta dirección.
    var APP = "https://alema-pruebas.streamlit.app";
    var CLAVE = "alema_sesion";

    // 1) Si el alumno ya había iniciado sesión aquí, se le pasa su sesión a la app.
    var sesion = null;
    try { sesion = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) {}
    var url = new URL(APP + "/");
    url.searchParams.set("embed", "true");
    url.searchParams.set("embed_options", "hide_loading_screen");
    if (sesion && sesion.u && sesion.t) {
      url.searchParams.set("u", sesion.u);
      url.searchParams.set("t", sesion.t);
    }
    document.getElementById("app").src = url.toString();

    // 2) La app avisa cuando el alumno inicia o cierra sesión (solo se acepta a tu app).
    window.addEventListener("message", function (e) {
      if (e.origin !== APP || !e.data) return;
      try {
        if (e.data.tipo === "alema-sesion" && e.data.u && e.data.t) {
          localStorage.setItem(CLAVE, JSON.stringify({ u: e.data.u, t: e.data.t }));
        }
        if (e.data.tipo === "alema-salir") localStorage.removeItem(CLAVE);
      } catch (err) {}
    });
  </script>
</body>
</html>
