* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tinta); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
#app { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: 44px 1fr; height: 100vh; }
#arriba { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 4px solid #0C0E15; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
#arriba::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 24px; background: var(--linea); margin: 0 6px; flex: none; }
.tb { height: 34px; padding: 0 9px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.tb:hover { background: var(--panel2); }
.tb.on { color: var(--azul); }
.tb svg { width: 20px; height: 20px; }
.marca { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 2px; font-weight: 700; letter-spacing: .12em; color: var(--ambar); font-size: 12px; flex: none; }
.marca i { width: 22px; height: 20px; background: var(--ambar); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
#simbolo { font-weight: 700; font-size: 14px; }
.tf { min-width: 34px; justify-content: center; font-weight: 600; }
.espacio { flex: 1; }
#tvbtn { border: 1px solid var(--linea); }
#izq { background: var(--bg); border-right: 4px solid #0C0E15; display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 2px; overflow-y: auto; scrollbar-width: none; }
#izq::-webkit-scrollbar { display: none; }
.herr { width: 38px; height: 38px; border-radius: 4px; display: grid; place-items: center; color: var(--tinta); flex: none; position: relative; }
.herr:hover { background: var(--panel2); }

"use strict";

const EJE_P = 68, EJE_T = 28, SEPARA = 1;

/* ---------- utilidades de formato ---------- */

/* ---------- datos mostrados ---------- */

/* ---------- paneles ---------- */

  const d = JSON.parse(JSON.stringify(orig)), def = HERRAMIENTAS[d.tipo], conNiv = !!def.niveles; if (conNiv) nivelesDe(d);
  const esFib = d.tipo === "fib" || d.tipo === "fibExt", conTexto = ["horizontal", "rayoH", "texto"].includes(d.tipo), esPos = d.tipo === "largo" || d.tipo === "corto";
  const pest = ["Estilo"].concat(conTexto ? ["Texto"] : [], ["Coordenadas"]);
  const op = (v, t, actual) => `<option value="${v}" ${String(actual) === String(v) ? "selected" : ""}>${t}</option>`;
  const fila = (et, ctl) => `<div class="cfila"><span>${et}</span><div>${ctl}</div></div>`;
  const chk = (k, et, val) => `<label class="chk"><input type="checkbox" data-b="${k}" ${val !== false ? "checked" : ""}> ${et}</label>`;
  const estiloLinea = fila("Línea", `<input type="color" data-k="color" value="${d.color || "#2962FF"}"><select data-k="ancho">${[1, 2, 3, 4].map(w => op(w, `${w}px`, d.ancho || 2)).join("")}</select><select data-k="estilo">${op("solida", "Sólida", d.estilo || "solida")}${op("guiones", "Guiones", d.estilo)}${op("puntos", "Puntos", d.estilo)}</select>`);
  let estilo = "";
  if (conNiv) {
    if (esFib) estilo += fila(chk("tendencia", "Línea de tendencia", d.tendencia), `<input type="color" data-k="colorTend" value="${d.colorTend || "#9598A1"}">`);
    if (esFib || d.tipo === "fibCanal") estilo += fila("Ampliar", `<select data-k="ext">${op("no", "No ampliar", d.ext || "no")}${op("izq", "Ampliar a la izquierda", d.ext)}${op("der", "Ampliar a la derecha", d.ext)}${op("ambos", "Ampliar a ambos lados", d.ext)}</select>`);
    else estilo += estiloLinea;
    estilo += `<div class="niveles">${d.niveles.map((n, i) => `<div class="niv"><input type="checkbox" data-non="${i}" ${n.on ? "checked" : ""}><input type="number" step="any" data-nv="${i}" value="${n.v}"><input type="color" data-nc="${i}" value="${n.c}"></div>`).join("")}</div>`;
    estilo += fila(chk("fondo", "Fondo", d.fondo), `<input type="range" min="0" max="40" data-k="opacidad" value="${Math.round((d.opacidad ?? .1) * 100)}">`);
    if (d.tipo === "fib" || d.tipo === "fibCanal") estilo += fila(chk("revertir", "Revertir", d.revertir === true), "");
    if (esFib) estilo += fila(chk("precios", "Precios", d.precios), "");
    estilo += fila(chk("niveles_txt", "Niveles", d.niveles_txt), `<select data-k="pct">${op("", "Valores", d.pct ? "1" : "")}${op("1", "Porcentaje", d.pct ? "1" : "")}</select>`);
    if (esFib) estilo += fila("Etiquetas", `<select data-k="etiq">${op("izq", "Izquierda", d.etiq || "izq")}${op("der", "Derecha", d.etiq)}</select>`);
    estilo += fila("Tamaño de la fuente", `<select data-k="tam">${[10, 11, 12, 14, 16, 20].map(t => op(t, t, d.tam || 11)).join("")}</select>`);
  } else if (!esPos && d.tipo !== "medir") {
    estilo = estiloLinea; if (d.tipo === "horizontal" || d.tipo === "rayoH") estilo += fila(chk("etiquetaPrecio", "Etiqueta de precios", d.etiquetaPrecio), "");
  } else estilo = '<p class="nota-v">Esta herramienta usa sus colores propios. Ajusta sus precios en Coordenadas.</p>';
  const texto = conTexto ? fila("Texto", `<input type="text" data-k="texto" value="${(d.texto || "").replace(/"/g, "&quot;")}" placeholder="Escribe un texto" style="width:220px">`) + (d.tipo === "texto" ? fila("Tamaño", `<select data-k="ancho">${[1, 2, 3, 4, 5, 6].map(w => op(w, 14 + (w - 2) * 2 + "px", d.ancho || 2)).join("")}</select>`) : "") : "";
  const nomPt = esPos ? ["Entrada", "Objetivo (TP)", "Stop (SL)"] : d.tipo === "xabcd" ? ["X", "A", "B", "C", "D"] : d.tipo === "elliott5" ? ["Inicio", "1", "2", "3", "4", "5"] : d.tipo === "elliottABC" ? ["Inicio", "A", "B", "C"] : d.tipo === "abc" ? ["A", "B", "C", "D"] : null;
  const coords = d.pts.map((p, i) => fila(`${nomPt ? nomPt[i] : d.pts.length > 1 ? "Punto " + (i + 1) : "Precio"}`, `<input type="number" step="any" data-pp="${i}" value="${p.p.toFixed(S.a.d)}" style="width:130px">${d.tipo === "horizontal" || d.tipo === "rayoH" || esPos && i ? "" : `<span class="fecha-p">${fmtT(p.t, true)}</span>`}`)).join("");
  const v = abrirVentana(`<header><span>${def.n}</span><button data-cerrar>×</button></header><nav class="tabs-d">${pest.map((p, i) => `<button data-tab="${i}" class="${i ? "" : "on"}">${p}</button>`).join("")}</nav>
    <div class="cuerpo cfg"><section data-sec="0">${estilo}</section>${conTexto ? `<section data-sec="1" hidden>${texto}</section>` : ""}<section data-sec="${pest.length - 1}" hidden>${coords}</section></div>
    <footer><button data-cerrar>Cancelar</button><button class="pri" id="okD">Aceptar</button></footer>`);
  v.querySelector(".ven").classList.add("ven-d");
  v.addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (!t) return; v.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b === t)); v.querySelectorAll("[data-sec]").forEach(s => s.hidden = s.dataset.sec !== t.dataset.tab); });
  $("#okD").onclick = () => {
    v.querySelectorAll("[data-k]").forEach(x => { const k = x.dataset.k; let val = x.value; if (k === "ancho" || k === "tam") val = +val; if (k === "opacidad") val = +val / 100; if (k === "pct") val = !!val; if (k === "ext" && val === "no") val = undefined; d[k] = val; });
    v.querySelectorAll("[data-b]").forEach(x => d[x.dataset.b] = x.checked);
    if (conNiv) d.niveles.forEach((n, i) => { n.on = v.querySelector(`[data-non="${i}"]`).checked; const nv = parseFloat(v.querySelector(`[data-nv="${i}"]`).value); if (isFinite(nv)) n.v = nv; n.c = v.querySelector(`[data-nc="${i}"]`).value; });
    v.querySelectorAll("[data-pp]").forEach(x => { const p = parseFloat(x.value); if (isFinite(p)) d.pts[+x.dataset.pp].p = p; });
    historia(); Object.keys(orig).forEach(k => delete orig[k]); Object.assign(orig, d); S.sel = orig; guardarDib(); cerrarVentana(); barraDib(); pedirDibujo(); };
}

/* ---------- repetición (replay) ---------- */
function iniciarReplay() {
  if (S.replay) return salirReplay();
  S.replay = { eligiendo: true, fin: S.todo.length - 1, vel: 1, timer: null }; $("#bReplay").classList.add("on"); $("#replayAviso").hidden = false; elegirHerr("cursor");
}
function textoReplay() { const b = S.todo[S.replay.fin]; $("#rFecha").textContent = b ? fmtT(b.t, true) : ""; $("#rPlay").textContent = S.replay.timer ? "⏸" : "▶"; }
function pasoReplay() { if (!S.replay || S.replay.fin >= S.todo.length - 1) { pausarReplay(); return; } const enVista = iDeX(plotW()) >= S.b.length - 2; S.replay.fin++; armarDatos(); if (enVista) S.der += 1; textoReplay(); pedirDibujo(); }
function pausarReplay() { if (S.replay && S.replay.timer) { clearInterval(S.replay.timer); S.replay.timer = null; textoReplay(); } }
function salirReplay() { pausarReplay(); S.replay = null; $("#replay").hidden = true; $("#replayAviso").hidden = true; $("#bReplay").classList.remove("on"); armarDatos(); S.der = S.b.length - 1 + 6; pedirDibujo(); }
function armarReplay() {
  $("#rPlay").onclick = () => { if (S.replay.timer) return pausarReplay(); S.replay.timer = setInterval(pasoReplay, 1000 / S.replay.vel); textoReplay(); };
  $("#rPaso").onclick = () => { pausarReplay(); pasoReplay(); };
  $("#rInicio").onclick = () => { pausarReplay(); S.replay.eligiendo = true; S.replay.fin = S.todo.length - 1; armarDatos(); $("#replay").hidden = true; $("#replayAviso").hidden = false; pedirDibujo(); };
  $("#rVel").onchange = e => { S.replay.vel = +e.target.value; if (S.replay.timer) { pausarReplay(); $("#rPlay").click(); } };
  $("#rSalir").onclick = salirReplay;
}

/* ---------- inicio ---------- */
async function iniciar() {
  armarIzquierda(); armarArriba(); armarReplay(); elegirHerr("cursor"); medir();
  const guardados = leer("inds", null); if (guardados && guardados.length) S.inds = guardados.filter(i => INDICADORES[i.tipo]).map(i => ({ ...i, p: Object.assign({}, INDICADORES[i.tipo].p, i.p) }));
  else { agregarInd("VOL"); }
  const u = leer("ultimo", null), a = u && ACTIVOS.find(x => x.s === u.s) || ACTIVOS[0], tf = u && TFS.find(x => x.k === u.tf) || TFS[5];
  await cargar(a, tf, false);
  setInterval(() => { if (!S.replay && !S.arrastre) pedirDibujo(); }, 1000); // cuenta regresiva de la vela
}
iniciar();

</script>
