* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--tinta); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
[hidden] { display: none !important; }
#app { display: grid; grid-template-columns: 52px 1fr; grid-template-rows: 44px 1fr; height: 100vh; }
#arriba { grid-column: 1 / -1; display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 4px solid #0C0E15; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
#arriba::-webkit-scrollbar { display: none; }
.sep { width: 1px; height: 24px; background: var(--linea); margin: 0 6px; flex: none; }
.tb { height: 34px; padding: 0 9px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.tb:hover { background: var(--panel2); }
.tb.on { color: var(--azul); }
.tb svg { width: 20px; height: 20px; }
.marca { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 2px; font-weight: 700; letter-spacing: .12em; color: var(--ambar); font-size: 12px; flex: none; }
.marca i { width: 22px; height: 20px; background: var(--ambar); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
#simbolo { font-weight: 700; font-size: 14px; }
.tf { min-width: 34px; justify-content: center; font-weight: 600; }
.espacio { flex: 1; }
#tvbtn { border: 1px solid var(--linea); }

  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)), d = b(PLATAFORMA_CIFRADA);
  const k = await crypto.subtle.importKey("raw", b(llave), "AES-GCM", false, ["decrypt"]);
  const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: d.slice(0, 12) }, k, d.slice(12))));
  document.getElementById("plataforma").outerHTML = p.html;
  const s = document.createElement("script"); s.textContent = p.js; document.body.appendChild(s);
  window.iniciarPlataforma();

<script>
/* ALEMA Gráficas · acceso: primera vez (admin), inicio de sesión, menú de usuario y panel de usuarios.
   El servidor (Apps Script) revisa las claves y entrega la llave que abre la plataforma. */
"use strict";
const ACC = (() => {
  const API = window.GRAFICAS_ACCESO || "";
  const $a = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const S2 = { token: "", yo: null };
  const guardarSes = (t, recordar) => { try { const v = JSON.stringify({ t, exp: Date.now() + 12 * 36e5 }); (recordar ? localStorage : sessionStorage).setItem("alema_graf_ses", v); } catch (e) {} };
  const leerSes = () => { for (const k of ["sessionStorage", "localStorage"]) { try { const v = JSON.parse(window[k].getItem("alema_graf_ses")); if (v && v.exp > Date.now()) return v.t; } catch (e) {} } return ""; };
  const borrarSes = () => { try { sessionStorage.removeItem("alema_graf_ses"); localStorage.removeItem("alema_graf_ses"); } catch (e) {} };
  async function api(accion, datos) {
    const r = await fetch(API, { method: "POST", body: JSON.stringify(Object.assign({ accion, token: S2.token }, datos || {})) });
    const j = await r.json(); if (j.salir) { borrarSes(); location.reload(); throw new Error(j.error); } return j;
  }
  const fecha = v => v ? new Date(v).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";

  /* ---------- pantalla de acceso ---------- */
  function pantalla(configurado, msg) {
    document.body.className = "login";
    $a("acceso").hidden = false; $a("acceso").innerHTML = configurado ? `
      <form class="caja" id="fAcc" autocomplete="off">
        <div class="marca"><i></i><b>ALEMA</b></div><h1>ALEMA Gráficas</h1><p class="sub">Plataforma de análisis para mentores de ALEMA</p>
        <label>Usuario<div class="campo"><input type="text" id="uAcc" placeholder="Tu usuario" autocomplete="username" autocapitalize="none" spellcheck="false"></div></label>
        <label>Clave<div class="campo"><input type="password" id="cAcc" placeholder="Tu clave" autocomplete="current-password"><button type="button" class="ver" data-ver="cAcc" aria-label="Mostrar u ocultar la clave">👁</button></div></label>
        <label class="chk"><input type="checkbox" id="rAcc" checked> Mantener la sesión en esta computadora (12 horas)</label>
        <p class="err" id="eAcc" ${msg ? "" : "hidden"}>${esc(msg || "")}</p><button class="entrar" id="bAcc">Entrar</button>
        <div class="pie">¿No tienes acceso? Pídelo a la Dirección de ALEMA.</div></form>` : `
      <form class="caja" id="fCfg" autocomplete="off">
        <div class="marca"><i></i><b>ALEMA</b></div><h1>Configuración inicial</h1>
        <p class="sub">Crea la cuenta de administrador. Necesitas el código de un solo uso que aparece al ejecutar <b>prepararGraficas()</b> en el Apps Script.</p>
        <label>Código de configuración<div class="campo"><input type="text" id="kCfg" placeholder="ALEMA-XXXX-XXXX" autocapitalize="characters" spellcheck="false"></div></label>
        <label>Tu nombre<div class="campo"><input type="text" id="nCfg" placeholder="Ej. Alex"></div></label>
        <label>Usuario<div class="campo"><input type="text" id="uCfg" placeholder="Ej. alex" autocapitalize="none" spellcheck="false"></div></label>
        <label>Clave (mínimo 8 caracteres)<div class="campo"><input type="password" id="cCfg" autocomplete="new-password"><button type="button" class="ver" data-ver="cCfg">👁</button></div></label>
        <label>Repite la clave<div class="campo"><input type="password" id="c2Cfg" autocomplete="new-password"></div></label>
        <p class="err" id="eCfg" hidden></p><button class="entrar" id="bCfg">Crear administrador y entrar</button></form>`;
    $a("acceso").addEventListener("click", e => { const v = e.target.closest("[data-ver]"); if (v) { const c = $a(v.dataset.ver); c.type = c.type === "password" ? "text" : "password"; } });
    const err = (id, t) => { $a(id).textContent = t; $a(id).hidden = !t; };
    if (configurado) $a("fAcc").onsubmit = async e => { e.preventDefault(); const b = $a("bAcc"); err("eAcc", "");
      const usuario = $a("uAcc").value.trim().toLowerCase(), clave = $a("cAcc").value; if (!usuario || !clave) return err("eAcc", "Escribe tu usuario y tu clave.");
      b.disabled = true; b.textContent = "Verificando…";
      try { const j = await api("entrar", { usuario, clave }); if (!j.ok) { err("eAcc", j.error); $a("cAcc").select(); return; } guardarSes(j.token, $a("rAcc").checked); await abrir(j); }
      catch (x) { err("eAcc", "No se pudo conectar. Intenta de nuevo."); } finally { b.disabled = false; b.textContent = "Entrar"; } };
    else $a("fCfg").onsubmit = async e => { e.preventDefault(); const b = $a("bCfg"); err("eCfg", "");
      const d = { codigo: $a("kCfg").value.trim().toUpperCase(), nombre: $a("nCfg").value.trim(), usuario: $a("uCfg").value.trim().toLowerCase(), clave: $a("cCfg").value };
      if (!d.codigo || !d.nombre || !d.usuario) return err("eCfg", "Completa todos los campos."); if (d.clave.length < 8) return err("eCfg", "La clave debe tener al menos 8 caracteres.");
      if (d.clave !== $a("c2Cfg").value) return err("eCfg", "Las claves no coinciden.");
      b.disabled = true; b.textContent = "Creando…";
      try { const j = await api("configurar", d); if (!j.ok) return err("eCfg", j.error); guardarSes(j.token, true); await abrir(j); }
      catch (x) { err("eCfg", "No se pudo conectar. Intenta de nuevo."); } finally { b.disabled = false; b.textContent = "Crear administrador y entrar"; } };
    setTimeout(() => (($a("uAcc") || $a("kCfg")) || {}).focus && ($a("uAcc") || $a("kCfg")).focus(), 50);
  }

  /* ---------- abrir la plataforma ---------- */
  async function abrir(j) {
    S2.token = j.token; S2.yo = { usuario: j.usuario, nombre: j.nombre, rol: j.rol };
    $a("acceso").hidden = true; $a("acceso").innerHTML = ""; document.body.className = "";
    await window.abrirPlataforma(j.llave); // descifra y arranca la gráfica
    menuUsuario();
  }
  async function iniciar() {
    const t = leerSes();
    if (t) { S2.token = t; try { const j = await api("sesion"); if (j.ok) return abrir(Object.assign(j, { token: t })); } catch (e) {} borrarSes(); S2.token = ""; }
    try { const j = await api("estado"); pantalla(j.configurado !== false); } catch (e) { pantalla(true, "No se pudo conectar con el servidor de acceso."); }
  }

  /* ---------- menú de usuario (barra de arriba) ---------- */
  function menuUsuario() {
    const b = $a("bUsuario"); if (!b) return; b.hidden = false; b.innerHTML = `👤 ${esc(S2.yo.nombre)} ▾`;
    b.onclick = () => menuFlotante(b, `<div class="menuT">${esc(S2.yo.nombre)} · ${S2.yo.rol === "admin" ? "Administrador" : "Mentor"}</div>
      ${S2.yo.rol === "admin" ? '<button data-op="usuarios">👥 Usuarios y accesos</button>' : ""}<button data-op="clave">🔑 Cambiar mi clave</button><button data-op="salir">⎋ Salir</button>`,
      op => op === "usuarios" ? panelUsuarios() : op === "clave" ? miClave() : salir(), true);
  }
  async function salir() { try { await api("salir"); } catch (e) {} borrarSes(); location.reload(); }
  function aviso(t) { let a = $a("avisoAcc"); if (!a) { a = document.createElement("div"); a.id = "avisoAcc"; document.body.appendChild(a); } a.textContent = t; a.hidden = false; clearTimeout(aviso.t); aviso.t = setTimeout(() => a.hidden = true, 3200); }
  function miClave() {
    const v = abrirVentana(`<header>Cambiar mi clave<button data-cerrar>×</button></header><div class="cuerpo cfg">
      <div class="cfila"><span>Clave actual</span><div><input type="password" id="mcA" autocomplete="current-password"></div></div>
      <div class="cfila"><span>Nueva clave (mín. 8)</span><div><input type="password" id="mcN" autocomplete="new-password"></div></div>
      <div class="cfila"><span>Repite la nueva</span><div><input type="password" id="mcR" autocomplete="new-password"></div></div><p class="err-v" id="mcE" hidden></p></div>
      <footer><button data-cerrar>Cancelar</button><button class="pri" id="mcOk">Guardar</button></footer>`);
    v.querySelector(".ven").classList.add("ven-d");
    $a("mcOk").onclick = async () => { const e = $a("mcE"), n = $a("mcN").value; e.hidden = true; const mal = t => { e.textContent = t; e.hidden = false; };
      if (n.length < 8) return mal("La nueva clave debe tener al menos 8 caracteres."); if (n !== $a("mcR").value) return mal("Las claves no coinciden.");
      const j = await api("miClave", { actual: $a("mcA").value, nueva: n }); if (!j.ok) return mal(j.error); cerrarVentana(); aviso("✓ Tu clave se cambió"); };
  }

  /* ---------- panel de usuarios (solo admin) ---------- */
  async function panelUsuarios(pest = "u") {
    const j = await api("usuarios"); if (!j.ok) return aviso("⚠️ " + j.error);
    const chip = (t, c) => `<span class="chipA ${c}">${t}</span>`;
    const filas = j.usuarios.map(u => `<div class="filaU"><div class="infoU"><div class="lin"><b>${esc(u.nombre)}</b>${chip(u.rol === "admin" ? "Admin" : "Mentor", u.rol === "admin" ? "am" : "az")}${u.activo ? chip("Activo", "ve") : chip("Desactivado", "ro")}</div>
        <small>@${esc(u.usuario)} · último acceso: ${fecha(u.ultimo)}</small></div>
      <div class="accU">${u.usuario === S2.yo.usuario ? '<small class="tu">Tú</small>' : `<button data-u="editar" data-id="${esc(u.usuario)}">Editar</button><button data-u="activar" data-id="${esc(u.usuario)}">${u.activo ? "Desactivar" : "Activar"}</button><button data-u="borrar" data-id="${esc(u.usuario)}" class="peligro">Borrar</button>`}</div></div>`).join("");
    const reg = j.accesos.map(a => `<div class="filaR"><span>${fecha(a.fecha)}</span><b>${esc(a.usuario || "—")}</b><span class="${a.ok ? "okR" : "noR"}">${esc(a.detalle)}</span></div>`).join("") || '<p class="nota-v">Sin registros todavía.</p>';
    const v = abrirVentana(`<header>Usuarios y accesos<button data-cerrar>×</button></header>
      <nav class="tabs-d"><button data-tab="u" class="${pest === "u" ? "on" : ""}">Mentores (${j.usuarios.length})</button><button data-tab="r" class="${pest === "r" ? "on" : ""}">Registro de accesos</button></nav>
      <div class="cuerpo"><section data-sec="u" ${pest === "u" ? "" : "hidden"}><button class="pri agregarU" data-u="nuevo">＋ Agregar mentor</button>${filas}</section>
      <section data-sec="r" ${pest === "r" ? "" : "hidden"}><div class="listaR">${reg}</div></section></div>`);
    v.querySelector(".ven").classList.add("ven-u");
    v.addEventListener("click", async e => {
      const t = e.target.closest("[data-tab]"); if (t) { v.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b === t)); v.querySelectorAll("[data-sec]").forEach(s => s.hidden = s.dataset.sec !== t.dataset.tab); return; }
      const b = e.target.closest("[data-u]"); if (!b) return; const u = j.usuarios.find(x => x.usuario === b.dataset.id);
      if (b.dataset.u === "nuevo") return formUsuario(null);
      if (b.dataset.u === "editar") return formUsuario(u);
      if (b.dataset.u === "activar") { const r = await api("activar", { usuario: u.usuario, activo: !u.activo }); if (!r.ok) return aviso("⚠️ " + r.error); aviso(u.activo ? `${u.nombre} ya no puede entrar` : `${u.nombre} puede volver a entrar`); return panelUsuarios(); }
      if (b.dataset.u === "borrar") { if (!b.classList.contains("seguro")) { b.classList.add("seguro"); b.textContent = "¿Seguro?"; return; }
        const r = await api("borrarUsuario", { usuario: u.usuario }); if (!r.ok) return aviso("⚠️ " + r.error); aviso(`Se borró a ${u.nombre}`); return panelUsuarios(); }
    });
  }
  function formUsuario(u) {
    const nuevo = !u, v = abrirVentana(`<header>${nuevo ? "Agregar mentor" : "Editar " + esc(u.nombre)}<button data-cerrar>×</button></header><div class="cuerpo cfg">
      <div class="cfila"><span>Nombre</span><div><input type="text" id="fuN" value="${esc(u ? u.nombre : "")}" placeholder="Ej. Daniela Lara"></div></div>
      <div class="cfila"><span>Usuario</span><div><input type="text" id="fuU" value="${esc(u ? u.usuario : "")}" ${nuevo ? "" : "disabled"} placeholder="Ej. daniela" autocapitalize="none" spellcheck="false"></div></div>
      <div class="cfila"><span>Rol</span><div><select id="fuR"><option value="mentor" ${!u || u.rol === "mentor" ? "selected" : ""}>Mentor</option><option value="admin" ${u && u.rol === "admin" ? "selected" : ""}>Administrador</option></select></div></div>
      <div class="cfila"><span>${nuevo ? "Clave inicial (mín. 8)" : "Nueva clave (opcional)"}</span><div><input type="text" id="fuC" placeholder="${nuevo ? "" : "Déjala vacía para no cambiarla"}" autocomplete="off" spellcheck="false"><button type="button" class="mini-b" id="fuG" title="Generar una clave">🎲</button></div></div>
      <p class="nota-v">${nuevo ? "Dale al mentor su usuario y su clave en privado. Después él puede cambiar su clave." : "Si cambias la clave, se le cierra la sesión al mentor."}</p><p class="err-v" id="fuE" hidden></p></div>
      <footer><button id="fuX">Cancelar</button><button class="pri" id="fuOk">${nuevo ? "Agregar" : "Guardar"}</button></footer>`);
    v.querySelector(".ven").classList.add("ven-d");
    $a("fuX").onclick = () => panelUsuarios();
    $a("fuG").onclick = () => { const a = "abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789", r = crypto.getRandomValues(new Uint32Array(10)); $a("fuC").value = [...r].map(x => a[x % a.length]).join(""); };
    $a("fuOk").onclick = async () => { const e = $a("fuE"), mal = t => { e.textContent = t; e.hidden = false; }; e.hidden = true;
      const d = { nuevo, nombre: $a("fuN").value.trim(), usuario: $a("fuU").value.trim().toLowerCase(), rol: $a("fuR").value, clave: $a("fuC").value };
      if (!d.nombre || !d.usuario) return mal("Escribe el nombre y el usuario."); if (!/^[a-z0-9._-]{3,30}$/.test(d.usuario)) return mal("El usuario solo puede tener letras, números, punto o guion (3 a 30).");
      if ((nuevo || d.clave) && d.clave.length < 8) return mal("La clave debe tener al menos 8 caracteres.");
      const r = await api("guardarUsuario", d); if (!r.ok) return mal(r.error); aviso(nuevo ? `✓ ${d.nombre} agregado` : "✓ Cambios guardados"); panelUsuarios(); };
  }
  return { iniciar, salir };
})();

ACC.iniciar();
</script>
</body>
</html>
